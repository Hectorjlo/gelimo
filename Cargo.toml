[package]
name = "gelimo"
version = "0.1.0"
edition = "2024"
default-run = "gelimo"
authors = ["Héctor Jesús López Ordaz <hectorjl@lcg.unam.mx>"]
description = "Generalized Phylogenetic Linear Models engine in Rust"

[dependencies]
faer = "0.21"
polars = { version = "0.46", features = ["lazy", "csv"] }
rayon = "1.10"
nom = "7.1"
clap = { version = "4.5", features = ["derive", "color", "cargo"] }
colored = "2.2"
anstyle = "1.0"

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "vcv_benchmarks"
harness = false
