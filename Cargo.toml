[package]
name = "gelimo"
version = "0.1.0"
edition = "2024"
authors = ["Héctor Jesús López Ordaz <hectorjl@lcg.unam.mx>"]
description = "Generalized Phylogenetic Linear Models engine in Rust"

[dependencies]
faer = "0.21"
polars = { version = "0.46", features = ["lazy", "csv"] }
rayon = "1.10"
argmin = "0.10"
approx = "0.5"
nom = "7.1"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "vcv_benchmarks"
harness = false
