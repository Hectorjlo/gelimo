[package]
name = "gelimo"
version = "0.1.0"
edition = "2024"
default-run = "gelimo"
authors = ["Héctor Jesús López-Ordaz <hectorjl@lcg.unam.mx>"]
description = "Generalized Phylogenetic Linear Models engine in Rust"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
faer = "0.21"
rayon = "1.10"
clap = { version = "4.5", features = ["derive", "color", "cargo"] }
colored = "2.2"
extendr-api = { version = "0.7", optional = true }


[features]
default = []
r-bindings = ["dep:extendr-api"]


[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "vcv_benchmarks"
harness = false
